services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/orders
      DB_USER: orders_app
      DB_PASSWORD: orders_app
      SPRING_FLYWAY_USER: orders_owner
      SPRING_FLYWAY_PASSWORD: orders_owner
    ports:
      - "8080:8080"
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  k6:
    image: grafana/k6:2.3.0
    profiles: ["load"]
    environment:
      API: http://app:8080
    volumes:
      - ./load-tests:/scripts:ro
    networks:
      - frontend
    depends_on:
      - app

  zap:
    image: zaproxy/zap-stable:2.17.0
    profiles: ["dast"]
    command:
      - zap-api-scan.py
      - -t
      - http://app:8080/v3/api-docs
      - -f
      - openapi
      - -r
      - zap-relatorio.html
      - -w
      - zap-relatorio.md
      - -I
    volumes:
      - ./target/zap:/zap/wrk:rw
    networks:
      - frontend
    depends_on:
      - app

  sonarqube:
    image: sonarqube:26.10.0.133078-community
    profiles: ["sonar"]
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
    networks:
      - frontend

networks:
  frontend:
  backend:
    internal: true

volumes:
  sonarqube-data:
