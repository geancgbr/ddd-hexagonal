spring.application.name=ddd-hexagonal
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/orders}
spring.datasource.username=${DB_USER:orders_app}
spring.datasource.password=${DB_PASSWORD:orders_app}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
springdoc.open-api.info.title=API de Pedidos
springdoc.open-api.info.version=1.0
springdoc.open-api.info.description=Cat\u00e1logo de produtos e pedidos com cupom de desconto. Erros no formato Problem Details (RFC 9457).
